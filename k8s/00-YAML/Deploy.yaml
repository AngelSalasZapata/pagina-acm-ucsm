# ==============================================================================
# INFRAESTRUCTURA KUBERNETES - CAPÍTULO ESTUDIANTIL ACM UCSM
# Namespace: 2023241041
# Componentes: Base de Datos (PostgreSQL), Backend (FastAPI), Frontend
# ==============================================================================

# ==========================================
# COMPONENTE 1: BASE DE DATOS SURREALDB (Persistente con SurrealKV)
# ==========================================
apiVersion: apps/v1
kind: StatefulSet   # Usamos StatefulSet porque SurrealKV maneja data local persistente y requiere identidad fija
metadata:
  name: ucsm-acm-db-set
  namespace: "2023241041"
  labels:
    app.kubernetes.io/part-of: ucsm-acm
spec:
  serviceName: "db-service"
  replicas: 1       # Fijo en 1 porque las DBs embebidas en disco local no se autoescalan horizontalmente
  selector:
    matchLabels:
      component: db
  template:
    metadata:
      labels:
        component: db
    spec:
      containers:
      - name: surrealdb
        image: surrealdb/surrealdb:v2.0.4 # Usamos la v2 para asegurar soporte nativo de surrealkv
        # Comando para inicializar SurrealKV en la ruta del volumen montado con tus credenciales root
        args:
        - "start"
        - "surrealkv:///surreal_data/acm_kv"
        - "--username"
        - "root"
        - "--password"
        - "root"
        - "--bind"
        - "0.0.0.0:8000"
        ports:
        - containerPort: 8000
          name: dbport
        volumeMounts:
        - name: surreal-storage
          mountPath: /surreal_data  # Apunta a la carpeta donde SurrealKV escribirá en el disco permanente
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
  # Define la solicitud del disco persistente de forma automática para el Pod
  volumeClaimTemplates:
  - metadata:
      name: surreal-storage
    spec:
      accessModes: [ "ReadWriteOnce" ] # El volumen solo lo monta este Pod de base de datos
      resources:
        requests:
          storage: 2Gi # Espacio suficiente para la data de la ACM
---
apiVersion: v1
kind: Service
metadata:
  name: db-service
  namespace: "2023241041"
spec:
  selector:
    component: db
  ports:
  - protocol: TCP
    port: 8000        # Cambiado a 8000 porque SurrealDB expone su API/RPC en este puerto
    targetPort: 8000
---
# ==========================================
# COMPONENTE 2: BACKEND FASTAPI (Autoescalable)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ucsm-acm-backend-deploy
  namespace: "2023241041"
  labels:
    app.kubernetes.io/part-of: ucsm-acm
spec:
  # OMITIDO 'replicas': El control del número de pods lo toma el HorizontalPodAutoscaler (HPA)
  selector:
    matchLabels:
      component: backend
  template:
    metadata:
      labels:
        component: backend
    spec:
      containers:
      - name: fastapi-backend
        image: ghcr.io/tu-usuario/mi-backend:latest
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ucsm-acm-secret-env
              key: database-url
        ports:
        - containerPort: 8000
          name: backport
        resources:
          # REQUISITO OBLIGATORIO: El HPA calcula el porcentaje basándose en los 'requests' de CPU
          requests:
            cpu: "100m"     # Reserva garantizada de 0.1 núcleos de CPU
            memory: "128Mi"
          limits:
            cpu: "500m"     # Techo máximo permitido antes de aplicar throttling
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: "2023241041"
spec:
  selector:
    component: backend
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000

---
# ==========================================
# COMPONENTE 3: AUTOESCALADO DEL BACKEND (HPA)
# ==========================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ucsm-acm-backend-hpa
  namespace: "2023241041"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ucsm-acm-backend-deploy # Monitorea el despliegue del backend
  minReplicas: 1  # Cantidad mínima de Pods en horas muertas de tráfico
  maxReplicas: 5  # Cantidad máxima de Pods para proteger los recursos del nodo/clúster
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70 # REGLA: Si el uso de CPU promedio supera el 70% de lo solicitado, genera un nuevo Pod

---
# ==========================================
# COMPONENTE 4: FRONTEND WEB (Autoescalable)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ucsm-acm-frontend-deploy
  namespace: "2023241041"
  labels:
    app.kubernetes.io/part-of: ucsm-acm
spec:
  selector:
    matchLabels:
      component: frontend
  template:
    metadata:
      labels:
        component: frontend
    spec:
      containers:
      - name: nginx-frontend
        image: ghcr.io/tu-usuario/mi-frontend:latest
        ports:
        - containerPort: 80
          name: frontport
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: "2023241041"
spec:
  type: LoadBalancer # Cambiar a ClusterIP si vas a mapear un componente Ingress Controller externo
  selector:
    component: frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80

---
# ==========================================
# COMPONENTE 5: AUTOESCALADO DEL FRONTEND (HPA)
# ==========================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ucsm-acm-frontend-hpa
  namespace: "2023241041"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ucsm-acm-frontend-deploy # Monitorea el despliegue del frontend
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75 # Escala de forma aislada si las peticiones de vistas estáticas aumentan
